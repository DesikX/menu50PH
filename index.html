    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .card-title { font-size: 1rem; font-weight: 700; color: #fff; line-height: 1.3; }
    .card-price { font-size: 1.1rem; font-weight: 800; color: var(--accent); white-space: nowrap; }

    const grid = document.getElementById("menuGrid");
    const searchInput = document.getElementById("search");
    const catButtons = document.querySelectorAll(".cat-btn");

    function renderCards(data) {
      grid.innerHTML = "";
      if (data.length === 0) { 
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">Нічого не знайдено 🤷‍♂️</div>`; 
        return; 
      }
      
      data.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-content">
            <div class="card-header">
              <h3 class="card-title">${item.title}</h3>
              <span class="card-price">${item.price}</span>
            </div>
            <div class="card-meta">
              <span class="weight-tag">⚖️ ${item.weight}</span>
              <span class="time-badge" style="position:relative; top:0; right:0;">${item.timeBadge}</span>
            </div>
            
            <div class="block-speech">
              <div class="block-speech-title">🗣 Як презентувати гостю:</div>
              <div class="block-speech-text">${item.speech}</div>
            </div>

            <div class="block-warn">
              <div class="block-warn-title">⚠️ Нюанси та підводні камені:</div>
              <div class="block-warn-text">${item.warn}</div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    renderCards(menuData);

    catButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        catButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        filterMenu();
      });
    });

    searchInput.addEventListener("input", filterMenu);

    function filterMenu() {
      const query = searchInput.value.toLowerCase().trim();
      const activeCat = document.querySelector(".cat-btn.active").dataset.cat;
      const filtered = menuData.filter(item => {
        const matchesCat = activeCat === "all" || item.category === activeCat;
        const matchesQuery = item.title.toLowerCase().includes(query) || 
                             item.speech.toLowerCase().includes(query) || 
                             item.warn.toLowerCase().includes(query);
        return matchesCat && matchesQuery;
      });
      renderCards(filtered);
    }
  </script>

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>50th Parallel | Шпаргалка офіціанта</title>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --tag-bg: #334155;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      line-height: 1.5;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent);
    }

    p.subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 600px;
      margin: 0 auto 20px;
    }

    .search-bar {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .search-bar:focus {
      border-color: var(--accent);
    }

    .category-filter {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .category-filter::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s;
    }
    .cat-btn.active, .cat-btn:hover {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      transition: transform 0.15s ease;
    }

    .card-img-wrapper {
      position: relative;
      height: 200px;
      background: #090d16;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--card-border);
      overflow: hidden;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-img-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #64748b;
      font-size: 0.8rem;
    }

    .time-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
      z-index: 2;
    }

    .card-actions {
      position: absolute;
      bottom: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      z-index: 2;
    }

    .action-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #475569;
      color: #fff;
      font-size: 0.7rem;
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .action-btn:hover {
      border-color: var(--accent);
    }

    .card-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }

    .card-price {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent);
      white-space: nowrap;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .weight-tag {
      background: var(--tag-bg);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .specs {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid var(--card-border);
      padding-top: 12px;
      font-size: 0.85rem;
    }

    .spec-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .spec-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #38bdf8;
    }

    .spec-label.ask {
      color: #f43f5e;
    }

    .spec-label.target {
      color: #4ade80;
    }

    .spec-desc {
      color: #cbd5e1;
      line-height: 1.35;
    }

    .allergen-box {
      margin-top: 6px;
      font-size: 0.75rem;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 6px 8px;
      border-radius: 6px;
    }

    .file-input {
      display: none;
    }
  </style>
</head>

                <span class="spec-desc">${item.inside}</span>
              </div>
              <div class="spec-item">
                <span class="spec-label target">🎯 Кому пропонувати:</span>
                <span class="spec-desc">${item.target}</span>
              </div>
              <div class="spec-item">
                <span class="spec-label ask">💬 Що спитати / уточнити:</span>
                <span class="spec-desc">${item.ask}</span>
              </div>
              ${item.allergens ? `
                <div class="allergen-box">
                  <strong>⚠️ Алергени:</strong> ${item.allergens}
                </div>
              ` : ""}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    renderCards(menuData);

    // Фільтрація
    catButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        catButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        filterMenu();
      });
    });

    searchInput.addEventListener("input", filterMenu);

    function filterMenu() {
      const query = searchInput.value.toLowerCase().trim();
      const activeCat = document.querySelector(".cat-btn.active").dataset.cat;

      const filtered = menuData.filter(item => {
        const matchesCat = activeCat === "all" || item.category === activeCat;
        const matchesQuery = item.title.toLowerCase().includes(query) ||
                             item.inside.toLowerCase().includes(query) ||
                             item.target.toLowerCase().includes(query);
        return matchesCat && matchesQuery;
      });

      renderCards(filtered);
    }

    // Вставка URL по кліку на кнопку
    window.setUrlImage = function(id) {
      const url = prompt("Вставте пряме посилання на картинку з сайту ChoiceQR:");
      if (url && url.trim().length > 0) {
        saveItemImage(id, url.trim());
      }
    };

    // Завантаження файлу
    window.uploadImage = function(event, id) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          saveItemImage(id, e.target.result);
        };
        reader.readAsDataURL(file);
      }
    };

    function saveItemImage(id, imgSrc) {
      const item = menuData.find(i => i.id === id);
      if (item) {
        item.img = imgSrc;
        savedImages[id] = imgSrc;
        try {
          localStorage.setItem('menu_custom_images', JSON.stringify(savedImages));
        } catch(e) {
          console.warn("Storage quota exceeded");
        }
        
        const imgBox = document.getElementById(`imgBox-${id}`);
        imgBox.querySelector(".card-img-placeholder")?.remove();
        let currentImg = imgBox.querySelector(".card-img");
        if (!currentImg) {
          currentImg = document.createElement("img");
          currentImg.className = "card-img";
          imgBox.prepend(currentImg);
        }
        currentImg.src = imgSrc;
      }
    }
  </script>
</body>
</html>
